# Configuration for Shop Forge Shopify App

name = "shop-forge"
client_id = "8e09eac89e33d5062083fa28d6e154f3"
application_url = "https://pagevault-production.up.railway.app"
embedded = true

[access_scopes]
scopes = "read_products,write_products,read_content,write_content,read_themes,write_themes,read_online_store_navigation,write_online_store_navigation"

[auth]
redirect_urls = [
  "https://pagevault-production.up.railway.app/auth/callback",
  "https://pagevault-production.up.railway.app/auth/shopify/callback",
  "https://pagevault-production.up.railway.app/api/auth/callback"
]

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = ["app/scopes_update"]

  # Mandatory GDPR Privacy Compliance Webhooks
  [[webhooks.subscriptions]]
  uri = "https://pagevault-production.up.railway.app/webhooks/customers/data_request"
  compliance_topics = ["customers/data_request"]

  [[webhooks.subscriptions]]
  uri = "https://pagevault-production.up.railway.app/webhooks/customers/redact"
  compliance_topics = ["customers/redact"]

  [[webhooks.subscriptions]]
  uri = "https://pagevault-production.up.railway.app/webhooks/shop/redact"
  compliance_topics = ["shop/redact"]

[pos]
embedded = false

